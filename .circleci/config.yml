version: 2.1

orbs:
  training-material: zenika-training/training-material@volatile

jobs:
  deploy:
    docker:
      # Même image que le job deploy de l'orb training-material (gcloud + bash)
      - image: gcr.io/google.com/cloudsdktool/google-cloud-cli:583.0.0-alpine
    resource_class: small
    steps:
      - checkout
      # Authentifie le compte de service (GAE_KEY_FILE_CONTENT) et sélectionne zen-formations
      - training-material/configure-gcloud
      - run:
          name: Déploiement du service default
          command: |
            if [ "$CIRCLE_BRANCH" = master ]; then
              # Prod : version promue, https://zen-formations.appspot.com
              gcloud app deploy app.yaml --version "go-listing-${CIRCLE_SHA1:0:7}" --promote --quiet
            else
              # Dev : version non promue, nommée d'après la branche, redéployée à chaque push.
              # ponytail: le libellé DNS "<version>-dot-zen-formations" est limité à 63 caractères.
              V="dev-$(echo "$CIRCLE_BRANCH" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9-]/-/g' | cut -c1-40 | sed 's/-*$//')"
              gcloud app deploy app.yaml --version "$V" --no-promote --quiet
              echo "Preview : https://$V-dot-zen-formations.appspot.com/"
            fi
      # Plafond de 210 versions pour tout zen-formations : purge les versions sans trafic
      # de plus de 7 jours (la version qui sert la prod n'est jamais supprimée).
      - training-material/prune-versions:
          service: default
          mode: apply

workflows:
  deploy:
    jobs:
      - deploy:
          context: training-deploy-gae
